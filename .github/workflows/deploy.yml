name: Deploy to Netlify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stage site
        run: |
          mkdir _site
          cp -r index.html css js _site/

      - name: Deploy preview
        if: github.event_name == 'pull_request'
        run: npx --yes netlify-cli@latest deploy --dir=_site --message="PR #${{ github.event.number }}"

      - name: Deploy production
        if: github.event_name != 'pull_request'
        run: npx --yes netlify-cli@latest deploy --dir=_site --prod --message="${{ github.sha }}"
